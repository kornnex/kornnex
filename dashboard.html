<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Comerciante - Kornnex</title>
    <style>
        :root {
    --bg-main: #0a1317;           /* Fondo general oscuro verdoso */
    --bg-card: #111d22;           /* Fondo de tarjetas y componentes */
    --bg-header: #060c0f;         /* Encabezado */
    --primary-teal: #14353d;      /* Verde azulado elegante */
    --accent-gold: #c69255;        /* Dorado oscuro profesional */
    --accent-gold-hover: #b07e44;  /* Dorado más profundo para interactivos */
    --text-light: #f0f4f5;        /* Texto claro contrastado */
    --text-muted: #889e9e;        /* Texto secundario sobrio */
    --border-color: #1a2c33;      /* Bordes finos y limpios */
    --success-green: #2a9d8f;
}
body {
    font-family: -apple-system, BlinkMacSystemSign, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-light);
    margin: 0;
    padding: 20px;
}
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        h2 {
            color: var(--accent-color);
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: white;
            box-sizing: border-box;
        }

        input[type="file"] {
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-home {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        #mensajeForm {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="btn-home">← Volver al Inicio</a>
        <h2>➕ Cargar Nuevo Comercio</h2>

        <form id="formCargarLocal" enctype="multipart/form-data">
            <div class="form-group">
                <label for="nombre">Nombre del Comercio *</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Barbería Silva">
            </div>

            <div class="form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria">
                    <option value="Gastronomía">Gastronomía / Resto</option>
                    <option value="Barbería / Peluquería">Barbería / Peluquería</option>
                    <option value="Ropa / Moda">Ropa / Moda</option>
                    <option value="Servicios">Servicios Técnicos</option>
                    <option value="Comercio">Comercio General</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="3" placeholder="Breve detalle de lo que ofrecés..."></textarea>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección / Zona</label>
                <input type="text" id="direccion" name="direccion" placeholder="Ej: Av. San Martín 123, Alejandro Korn">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono / WhatsApp</label>
                <input type="text" id="telefono" name="telefono" placeholder="Ej: 1122334455">
            </div>

            <div class="form-group">
                <label for="imagenArchivo">Foto o Logo del Negocio (Subir archivo)</label>
                <input type="file" id="imagenArchivo" name="imagenArchivo" accept="image/*">
            </div>

            <button type="submit" id="btnSubmit">Guardar y Publicar Comercio</button>
        </form>

        <div id="mensajeForm"></div>
    </div>

    <script>
        document.getElementById('formCargarLocal').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const mensaje = document.getElementById('mensajeForm');
            btn.disabled = true;
            btn.innerText = 'Cargando imagen y publicando...';

            const formData = new FormData(e.target);

            try {
                const res = await fetch('/api/negocios', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    mensaje.style.display = 'block';
                    mensaje.style.backgroundColor = '#03dac6';
                    mensaje.style.color = '#000';
                    mensaje.innerText = '¡Comercio publicado con éxito en Kornnex!';
                    document.getElementById('formCargarLocal').reset();
                } else {
                    throw new Error(data.error || 'Error al guardar');
                }
            } catch (err) {
                mensaje.style.display = 'block';
                mensaje.style.backgroundColor = '#cf6679';
                mensaje.style.color = '#fff';
                mensaje.innerText = 'Hubo un error al guardar el comercio. Intentalo de nuevo.';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Guardar y Publicar Comercio';
            }
        });
    </script>
</body>
</html>
