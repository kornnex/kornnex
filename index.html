<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kornnex - Directorio Comercial de Alejandro Korn</title>
    <style>
        :root {
    --bg-main: #0a1317;           /* Fondo general oscuro verdoso */
    --bg-card: #111d22;           /* Fondo de tarjetas y componentes */
    --bg-header: #060c0f;         /* Encabezado */
    --primary-teal: #14353d;      /* Verde azulado elegante */
    --accent-gold: #c69255;        /* Dorado oscuro profesional */
    --accent-gold-hover: #b07e44;  /* Dorado más profundo para interactivos */
    --text-light: #f0f4f5;        /* Texto claro contrastado */
    --text-muted: #889e9e;        /* Texto secundario sobrio */
    --border-color: #1a2c33;      /* Bordes finos y limpios */
    --success-green: #2a9d8f;
}

        body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-main, #0a1317);
    color: var(--text-light, #f0f4f5);
    margin: 0;
    padding: 0;
}

        header {
    background-color: var(--bg-header, #060c0f);
    padding: 15px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--border-color, #1a2c33);
}

header .logo {
    font-size: 1.4rem;
    font-weight: bold;
    color: var(--accent-gold, #c69255);
    display: flex;
    align-items: center;
    gap: 8px;
}

header nav {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

header nav a, header nav button {
    background-color: var(--primary-teal, #14353d);
    color: var(--text-light, #f0f4f5);
    border: 1px solid var(--border-color, #1a2c33);
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
}

        .auth-buttons a {
            background-color: var(--accent-color);
            color: #121212;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-left: 10px;
        }

        .auth-buttons a.admin-btn {
            background-color: #03dac6;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: white;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        /* Tarjeta de Anuncio / Destacada */
        .card.destacado {
            border: 2px solid var(--gold-color);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            grid-column: span 1;
        }

        .badge-ads {
            background-color: var(--gold-color);
            color: #000;
            font-weight: bold;
            font-size: 11px;
            padding: 4px 8px;
            position: absolute;
            top: 10px;
            right: 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .card-img-container {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #2a2a2a;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }

        .card.destacado h3 {
            color: var(--gold-color);
        }

        .category {
            font-size: 12px;
            color: var(--accent-color);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .description {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 12px;
        }

        .info-footer {
            font-size: 13px;
            color: #888;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Kornnex 🏙️</h1>
        <div class="auth-buttons">
            <a href="login.html">Iniciar Sesión / Registro</a>
            <a href="admin.html" class="admin-btn">Panel Admin</a>
        </div>
    </header>

    <div class="container">
        <input type="text" id="searchInput" class="search-bar" placeholder="Buscar comercios, servicios o categorías en Alejandro Korn...">
        
        <div id="negociosGrid" class="grid">
            <!-- Los negocios se cargan dinámicamente -->
        </div>
    </div>

    <script>
        async function cargarNegocios() {
            try {
                const res = await fetch('/api/negocios');
                const negocios = await res.json();
                const grid = document.getElementById('negociosGrid');
                grid.innerHTML = '';

                if (negocios.length === 0) {
                    grid.innerHTML = '<p style="color: #888;">No hay comercios cargados todavía.</p>';
                    return;
                }

                negocios.forEach(n => {
                    const esDestacado = n.destacado === 1 || n.adquirido === 1;
                    const card = document.createElement('div');
                    card.className = `card ${esDestacado ? 'destacado' : ''}`;

                    card.innerHTML = `
                        <div class="card-img-container">
                            <img src="${n.imagen || '/uploads/default.jpg'}" alt="${n.nombre}" onerror="this.src='https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=500'">
                            ${esDestacado ? '<span class="badge-ads">⭐ Anuncio</span>' : ''}
                        </div>
                        <div class="card-content">
                            <div>
                                <div class="category">${n.categoria || 'Comercio'}</div>
                                <h3>${n.nombre}</h3>
                                <div class="description">${n.descripcion || 'Sin descripción.'}</div>
                            </div>
                            <div class="info-footer">
                                📍 ${n.direccion || 'Alejandro Korn'} <br>
                                📞 ${n.telefono || 'Sin teléfono'}
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error('Error al cargar negocios:', err);
            }
        }

        // Buscador interactivo
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const termino = e.target.value.toLowerCase();
            const tarjetas = document.querySelectorAll('.card');
            tarjetas.forEach(card => {
                const texto = card.innerText.toLowerCase();
                card.style.display = texto.includes(termino) ? 'flex' : 'none';
            });
        });

        cargarNegocios();
    </script>
</body>
</html>
