<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Kornnex</title>
    <style>
    :root {
    --bg-main: #0a1317;           /* Fondo general oscuro verdoso */
    --bg-card: #111d22;           /* Fondo de tarjetas y componentes */
    --bg-header: #060c0f;         /* Encabezado */
    --primary-teal: #14353d;      /* Verde azulado elegante */
    --accent-gold: #c69255;        /* Dorado oscuro profesional */
    --accent-gold-hover: #b07e44;  /* Dorado más profundo para interactivos */
    --text-light: #f0f4f5;        /* Texto claro contrastado */
    --text-muted: #889e9e;        /* Texto secundario sobrio */
    --border-color: #1a2c33;      /* Bordes finos y limpios */
    --success-green: #2a9d8f;
}

       body {
    font-family: -apple-system, BlinkMacSystemSign, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-light);
    margin: 0;
    padding: 20px;
}

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Pantalla de Login Admin */
        #loginOverlay {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }

        #loginOverlay input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
        }

        #loginOverlay button {
            width: 95%;
            padding: 10px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Panel Principal de Admin */
        #adminPanel {
            display: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        .admin-table th, .admin-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .admin-table th {
            background-color: #2a2a2a;
            color: var(--accent-color);
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-save {
            background-color: var(--success-color);
            color: black;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .badge-adquirido {
            background-color: var(--success-color);
            color: black;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- PANTALLA DE ACCESO SEGURA -->
        <div id="loginOverlay">
            <h2>🔒 Acceso Administrador</h2>
            <p style="color: #888; font-size: 14px;">Ingresá tus credenciales de SuperAdmin</p>
            <input type="text" id="adminUser" placeholder="Usuario Admin">
            <input type="password" id="adminPass" placeholder="Contraseña">
            <button onclick="autenticarAdmin()">Ingresar al Panel</button>
            <p id="errorLogin" style="color: var(--danger-color); display: none; margin-top: 10px;"></p>
        </div>

        <!-- PANEL DE CONTROL ADMIN -->
        <div id="adminPanel">
            <header>
                <h1>Panel de Gestión - Kornnex 🛡️</h1>
                <a href="index.html" style="color: var(--accent-color); text-decoration: none; font-weight: bold;">← Volver al Inicio</a>
            </header>

            <h3>Locales Registrados</h3>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Estado Adquirido</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaLocales">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // Autenticación de Admin
        async function autenticarAdmin() {
            const usuario = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;
            const errorElement = document.getElementById('errorLogin');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('adminToken', data.token);
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    cargarLocalesAdmin();
                } else {
                    errorElement.innerText = data.message;
                    errorElement.style.display = 'block';
                }
            } catch (err) {
                errorElement.innerText = 'Error de conexión con el servidor.';
                errorElement.style.display = 'block';
            }
        }

        // Cargar lista de locales para gestionar
        async function cargarLocalesAdmin() {
            const res = await fetch('/api/negocios');
            const locales = await res.json();
            const tbody = document.getElementById('tablaLocales');
            tbody.innerHTML = '';

            locales.forEach(l => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${l.id}</td>
                    <td><strong>${l.nombre}</strong></td>
                    <td>${l.categoria || 'Comercio'}</td>
                    <td>
                        <label>
                            <input type="checkbox" id="chk-${l.id}" ${l.adquirido === 1 ? 'checked' : ''}>
                            Adquirido / Destacado
                        </label>
                    </td>
                    <td>
                        <button class="btn-save" onclick="guardarEstado(${l.id})">Guardar</button>
                        <button class="btn-delete" onclick="eliminarLocal(${l.id})">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Actualizar el estado 'adquirido'
        async function guardarEstado(id) {
            const esAdquirido = document.getElementById(`chk-${id}`).checked;
            try {
                const res = await fetch(`/api/admin/negocios/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adquirido: esAdquirido ? 1 : 0, destacado: esAdquirido ? 1 : 0 })
                });
                if (res.ok) {
                    alert('Estado actualizado correctamente.');
                    cargarLocalesAdmin();
                }
            } catch (err) {
                alert('Error al guardar cambios.');
            }
        }

        // Eliminar local
        async function eliminarLocal(id) {
            if (!confirm('¿Seguro que querés eliminar este local?')) return;
            try {
                const res = await fetch(`/api/admin/negocios/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Local eliminado.');
                    cargarLocalesAdmin();
                }
            } catch (err) {
                alert('Error al eliminar.');
            }
        }
    </script>
</body>
</html>
